name: Build & Deploy kiedy-matura.pl

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: deploy-kiedy-matura
  cancel-in-progress: true

# OIDC zamiast dĹ‚ugoĹĽyjÄ…cych kluczy â€” rola gh-deploy-kiedy-matura.pl ufa
# wyĹ‚Ä…cznie temu repo na gaĹ‚Ä™zi main (patrz templates/aws/setup-deploy-role.sh).
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # ARN roli i region nie sÄ… tajne (dostÄ™p i tak kontroluje trust policy
      # OIDC), a trzymane jawnie eliminujÄ… caĹ‚Ä… klasÄ™ bĹ‚Ä™dĂłw â€žsekret zawiera
      # niewidoczny znak".
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::381492300277:role/gh-deploy-kiedy-matura.pl
          aws-region: eu-central-1

      # Assety majÄ… hash w nazwie â†’ cache na rok. HTML/XML/TXT krĂłtko, bo
      # licznik i â€žza X dni" starzejÄ… siÄ™ razem z buildem.
      - name: Sync do S3
        run: |
          aws s3 sync dist/ "s3://www.kiedy-matura.pl/" --delete --size-only \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" --exclude "robots.txt" --exclude "sitemap*.xml"
          aws s3 sync dist/ "s3://www.kiedy-matura.pl/" --delete \
            --cache-control "public, max-age=300, must-revalidate" \
            --exclude "*" --include "*.html" --include "robots.txt" --include "sitemap*.xml"

      - name: Inwalidacja CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "E29IG4NRZRDOZ5" \
            --paths "/*" --query "Invalidation.Status" --output text

      - name: Weryfikacja
        run: |
          set -e
          code=$(curl -s -o /dev/null -w "%{http_code}" https://www.kiedy-matura.pl/)
          echo "www: $code"
          [ "$code" = "200" ] || exit 1
          redir=$(curl -s -o /dev/null -w "%{http_code}" https://kiedy-matura.pl/)
          echo "naked: $redir"
